ing","multiValued":false,"description":"A human-readable name, primarily used for display purposes.","required":false,"caseExact":true,"mutability":"readWrite","returned":"default","uniqueness":"none"},{"name":"primary","type":"boolean","multiValued":false,"description":"A Boolean value indicating the primary or preferred attribute value for this attribute, e.g., the preferred mailing address or primary email address.  The primary attribute value true MUST appear no more than once.","required":false,"caseExact":false,"mutability":"readWrite","returned":"default","uniqueness":"none"}]},{"name":"locale","type":"string","multiValued":false,"description":"Used to indicate the Users default location for purposes of localizing items such as currency, date time format, or numerical representations.","required":false,"caseExact":true,"mutability":"readWrite","returned":"default","uniqueness":"none"},{"name":"name","type":"complex","multiValued":false,"description":"The components of the users real name. Providers MAY return just the full name as a single string in the formatted sub-attribute, or they MAY return just the individual component attributes using the other sub-attributes, or they MAY return both.  If both variants are returned, they SHOULD be describing the same name, with the formatted name indicating how the component attributes should be combined.","required":false,"caseExact":false,"mutability":"readWrite","returned":"default","uniqueness":"none","subAttributes":[{"name":"formatted","type":"string","multiValued":false,"description":"The full name, including all middle names, titles, and suffixes as appropriate, formatted for display (e.g., Ms. Barbara J Jensen, III).","required":false,"caseExact":true,"mutability":"readWrite","returned":"default","uniqueness":"none"},{"name":"familyName","type":"string","multiValued":false,"description":"The family name of the User, or last name in most Western languages (e.g., Jensen given the full name Ms. Barbara J Jensen,