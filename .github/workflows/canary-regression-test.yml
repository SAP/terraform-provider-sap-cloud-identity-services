name: Canary regression Test - Terraform Provider

# Running tests against the canary tenant

on:
  workflow_dispatch:

env:
  PATH_TO_TFSCRIPT: 'regression-test'
  DEV_OVERRIDE: 'assets/provider-config-ghaction.txt'
  TEMP_PLAN_OUTPUT : 'plan-output.txt'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Git repository
        id: checkout_repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - run: go mod download
      - run: go mod tidy
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          skip-cache: true

  test:
    name: Regression Test against Canary Tenant
    needs: build
    runs-on: ubuntu-latest
    environment:
          name: sci

    steps:
    - name: Check out Git repository
      id: checkout_repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Setup Terraform
      id : setup_terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_wrapper: false
        terraform_version: latest

    - name: Install local Terraform provider
      id: build_provider
      shell: bash
      run: |
        go mod tidy && make install

    - name: Remove init data and place override
      id: set_to_override
      shell: bash
      run: |
        rm -rf .terraform && rm -rf .terraform.lock.hcl && cp ${{ env.DEV_OVERRIDE }} ~/.terraformrc

    - name: Terraform Apply with local provider
      id: terraform_apply_local
      shell: bash
      env:
        P12_CERTIFICATE_BASE64_STRING: ${{ secrets.CANARY_P12_CERTIFICATE_BASE64_STRING }}
        PATH_TO_TFSCRIPT: ${{ env.PATH_TO_TFSCRIPT }}
      run: |
        echo "$P12_CERTIFICATE_BASE64_STRING" | base64 --decode > $PATH_TO_TFSCRIPT/cert.p12

        terraform -chdir=$PATH_TO_TFSCRIPT apply \
        -var tenant_url="${{ secrets.CANARY_TENANT_URL }}" \
        -var certificate_file_path="cert.p12" \
        -var certificate_file_password="${{ secrets.P12_CERTIFICATE_PASSWORD }}" \
        -var certificate="${{ secrets.PEM_CERTIFICATE_STRING }}" \
        -auto-approve -no-color

    - name: Terraform Destroy with local provider
      if: always()
      id: terraform_destory
      shell: bash
      env:
        P12_CERTIFICATE_BASE64_STRING: ${{ secrets.CANARY_P12_CERTIFICATE_BASE64_STRING }}
        PATH_TO_TFSCRIPT: ${{ env.PATH_TO_TFSCRIPT }}
      run: |
        echo "$P12_CERTIFICATE_BASE64_STRING" | base64 --decode > $PATH_TO_TFSCRIPT/cert.p12

        terraform -chdir=$PATH_TO_TFSCRIPT destroy \
        -var tenant_url="${{ secrets.CANARY_TENANT_URL }}" \
        -var certificate_file_path="cert.p12" \
        -var certificate_file_password="${{ secrets.P12_CERTIFICATE_PASSWORD }}" \
        -var certificate="${{ secrets.PEM_CERTIFICATE_STRING }}" \
        -auto-approve -no-color
